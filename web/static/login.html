<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title data-i18n="meta.loginTitle">Вход · Kriloud AI</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Kriloud AI" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="/style.css?v=27" />
</head>
<body class="page-auth">
  <main class="auth">
    <div class="auth-head">
      <span class="orb" aria-hidden="true"></span>
      <h1 class="auth-title" id="authTitle">Вход в Kriloud</h1>
      <p class="auth-sub" id="authSub">Войдите, чтобы продолжить</p>
    </div>

    <div class="segmented" id="tabs">
      <button class="segment active" data-tab="login" type="button" data-i18n="auth.tabLogin">Вход</button>
      <button class="segment" data-tab="register" type="button" data-i18n="auth.tabRegister">Регистрация</button>
    </div>

    <form class="auth-form" id="authForm">
      <input class="field" type="email" id="email" placeholder="Почта" autocomplete="email" required aria-label="Почта" data-i18n-placeholder="auth.email" data-i18n-aria="auth.email" />
      <input class="field" type="password" id="password" placeholder="Пароль" autocomplete="current-password" required minlength="8" aria-label="Пароль" data-i18n-placeholder="auth.password" data-i18n-aria="auth.password" />
      <p class="form-hint" id="passwordHint" data-i18n="auth.passwordHint" hidden>Не короче 8 символов</p>
      <p class="form-error" id="formError" hidden></p>
      <button class="btn-primary" type="submit" id="submitBtn">Войти</button>
    </form>

    <div class="auth-foot">
      <span id="planNote" data-i18n="auth.planNote" hidden>Новый аккаунт получает тариф Free — 10 000 токенов в сутки.</span>
      <a href="/" data-i18n="auth.back">Вернуться в чат</a>
      <div class="auth-langs" id="langSwitch">
        <button class="auth-lang" type="button" data-lang="ru">Русский</button>
        <button class="auth-lang" type="button" data-lang="ja">日本語</button>
      </div>
    </div>
  </main>

  <script src="/i18n.js?v=27"></script>
  <script src="/login.js?v=27"></script>
</body>
</html>
